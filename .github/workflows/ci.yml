name: Prüfen und bauen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Tests, Export, Struktur, Seite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Python-Version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version; print(sys.version)'
      - name: Vertraulichkeit
        env:
          VERTRAULICH_MUSTER: ${{ vars.VERTRAULICH_MUSTER }}
        run: python3 -I werkzeuge/ek.py vertraulich
      - name: Tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Export aus den eingecheckten Rohdaten
        run: python3 -I werkzeuge/ek.py exportieren
      - name: Strukturprüfung
        run: python3 -I werkzeuge/ek.py pruefen
      - name: Fragenkatalog
        run: python3 -I werkzeuge/ek.py fragenkatalog
      - name: Texte für KI-Systeme (Markdown je GOP, llms.txt)
        run: python3 -I werkzeuge/ek.py texte
      - name: MCP-Server antwortet
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ebm_gop","arguments":{"nr":"03000"}}}' \
            | python3 -I werkzeuge/ek.py mcp | tail -1 | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; assert not r["isError"] and "Versichertenpauschale" in r["content"][0]["text"]; print("MCP ok")'
      - name: Daten sichern
        uses: actions/upload-artifact@v7
        with:
          name: ebm-katalog-daten
          path: |
            ausgabe/*/
            ausgabe/fragenkatalog-bericht.md
            !ausgabe/site/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ausgabe/site

  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    needs: pruefen
    # Aus, solange die Repository-Variable PAGES_FREIGEGEBEN nicht auf "ja" steht.
    if: github.ref == 'refs/heads/main' && vars.PAGES_FREIGEGEBEN == 'ja'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.bereitstellung.outputs.page_url }}
    steps:
      - id: bereitstellung
        uses: actions/deploy-pages@v5
